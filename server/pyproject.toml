[project]
name = "server"
version = "0.1.0"
description = "ResolveAI Server Backend"
readme = "README.md"
authors = [
    { name = "Sandeep-singh-99", email = "sandeep.necoder@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.2",
    "google-genai>=3.0.0",
    "greenlet>=3.5.6",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
