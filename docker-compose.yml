services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: resolveai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Live hot-reloading for local code edits
      - ./server/app:/app/app:ro
      - ./server/alembic:/app/alembic:ro
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
